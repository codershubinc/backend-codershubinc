<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Login/Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: #333;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
            margin-bottom: -2px;
        }

        .oauth-button {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            font-size: 1rem;
            color: #333;
        }

        .oauth-button:hover {
            background: #f8f8f8;
            border-color: #ccc;
        }

        .oauth-button img {
            width: 24px;
            height: 24px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        #response {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            display: none;
        }

        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .loading {
            display: none;
            margin: 1rem 0;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome</h1>

        <div class="tabs">
            <div class="tab active" data-tab="signup">Sign Up</div>
            <div class="tab" data-tab="login">Login</div>
        </div>

        <button class="oauth-button" onclick="handleOAuth('google')">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
            Continue with Google
        </button>

        <button class="oauth-button" onclick="handleOAuth('github')">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub">
            Continue with GitHub
        </button>

        <div class="divider">
            <span>or</span>
        </div>

        <button class="oauth-button" onclick="window.location.href='/auth/login.html'">
            Continue with Email
        </button>

        <div class="loading">
            <div class="spinner"></div>
            Processing...
        </div>

        <div id="response"></div>
    </div>

    <script>
        let currentTab = 'signup';
        const BASE_ = 'http://localhost:3001/user/oauth';

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
            });
        });

        async function handleOAuth(provider) {
            const loading = document.querySelector('.loading');
            const responseDiv = document.getElementById('response');

            loading.style.display = 'block';
            responseDiv.style.display = 'none';

            try {
                // Get the current  for success/failure redirects
                const current = window.location.origin;
                const success = `${current}/oauth-success.html`;
                const failure = `${current}/oauth-failure.html`;

                // Make request to your backend based on current tab
                const endpoint = currentTab === 'signup' ? 'signup' : 'login';

                const response = await fetch(`${BASE_}/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        provider,
                        success,
                        failure
                    }),
                    credentials: 'include' // Important for cookies
                });

                const data = await response.json();
                console.log('OAuth Response:', data.data);
                

                if (data.data) {
                    // Redirect to OAuth provider
                    window.location.href = data.data;
                } else if (response.ok) {
                    showResponse('Success! Redirecting...', true);
                    setTimeout(() => {
                        // window.location.href = success;
                    }, 1000);
                } else {
                    showResponse(`Error: ${data.message || 'Something went wrong'}`, false);
                }
            } catch (error) {
                showResponse(`Error: ${error.message}`, false);
                console.error('OAuth Error:', error);
            } finally {
                loading.style.display = 'none';
            }
        }

        function showResponse(message, isSuccess) {
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = message;
            responseDiv.className = isSuccess ? 'success' : 'error';
            responseDiv.style.display = 'block';
        }

        // Handle OAuth callback parameters
        const Params = new SearchParams(window.location.search);
        const error = Params.get('error');
        const success = Params.get('success');
        const userId = Params.get('userId');
        const secret = Params.get('secret');

        // Handle OAuth callback
        if (userId && secret) {
            handleOAuthCallback(userId, secret);
        } else if (error) {
            showResponse(`Authentication Error: ${error}`, false);
        } else if (success) {
            showResponse('Authentication successful!', true);
        }

        async function handleOAuthCallback(userId, secret) {
            try {
                const response = await fetch(`${BASE_}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userId, secret }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showResponse('Login successful! Redirecting...', true);
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // or your success page
                    }, 1000);
                } else {
                    showResponse(`Error: ${data.message}`, false);
                }
            } catch (error) {
                showResponse(`Error: ${error.message}`, false);
            }
        }
    </script>
</body>

</html>
